{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}School Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'students/style.css' %}">
</head>
<body>
    <header>
        <a class="brand" href="{% url 'pages:accueil' %}">School Manager</a>
        <nav>
            <a href="{% url 'students:list' %}">Étudiants</a>
            <a href="{% url 'teachers:list' %}">Enseignants</a>
            <a href="{% url 'pages:courses' %}">Cours</a>
            <a href="{% url 'pages:about' %}">À propos</a>
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}
                <p class="message {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
